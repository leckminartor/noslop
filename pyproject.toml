[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "noslop"
version = "0.1.0"
description = "Measured, verifiable removal of AI-music codec artifacts (RVQ residuals, sizzle, metallic ringing)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Klaus", email = "leckminartor@users.noreply.github.com" }]
keywords = ["audio", "rvq", "codec", "artifacts", "restoration", "demucs", "ai-music"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Sound/Audio",
]

[project.urls]
Homepage = "https://github.com/leckminartor/noslop"
Repository = "https://github.com/leckminartor/noslop"
Changelog = "https://github.com/leckminartor/noslop/blob/main/CHANGELOG.md"

[project.scripts]
noslop = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]
